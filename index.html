<!DOCTYPE html>
<html lang="pt-br">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Blog</title>
      <style>
       header{
          background-color: #f790e0;
          color: #ffffff;
          text-align: center;
          max: width 800px;
          margin: 0 auto;
          padding: 16px;
        }
        main{
            background-color: #ffffff;
            color: #f790e0;
            max: width 800px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
        }
        img{ 
            width: 80px;
            height: 80px;
        }
        .artigo-autor {
            front-weight: bold;
        }
      </style>
   </head>
   <body>
       <header>
        <h1>Moda e estilo</h1>
        <p>Vou compartilhar conhecimentos sobre tecnologia e programação</p>
       </header>
       <main>
        <img src="imagem-moda.png" alt="Ilustração fofa de roupas em tons de rosa-claro, com um cardigan de tricô, uma blusa branca com coração, uma saia xadrez rosa e uma bolsa rosa, decorados com pequenos corações e brilhos.">
        <img src="imagem2-moda.png" alt="Ilustração fofa de moda em tons de rosa-claro, mostrando uma blusa com babados e laço, uma saia xadrez, um cardigan de tricô, uma bolsa delicada, um acessório de cabelo e flores.">
    <div>
        <h2>Meu primeiro post</h2> 
        <p class="artigo-autor">Por: Marcelo Paludetto</p>
        <p>Boas-vindas ao meu novo blog ! Aqui vou compartilhar dicas de programação e curiosides da área de tecnologia.</p>
        <button>💖 <span>0</span></button>
        <button>👍<span>0</span></button>
    </div>

     </main>
 </body>
 <script>
    const botoes = document.querySelectorAll("button")

    botoes.forEach(function(botao){
     botao.addEventListener("click",botaoClicado)   
     function botaoClicado(){
        console.log("fui clicado");
        let texto = botao.querySelector9("span");
        texto.textContent++;
        }
    })
    

   

 </script>
</html>
